<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lebenslauf Manager Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-file-earmark-person-fill me-2"></i>CV-Manager Pro
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="card-title mb-0"><i class="bi bi-person-plus-fill me-2"></i>Neuer Lebenslauf</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="lebenslauf-form">
                            <div class="mb-3">
                                <label for="name" class="form-label font-weight-bold">Vollständiger Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="name" required placeholder="z.B. Max Mustermann">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="beruf" class="form-label">Angestrebter Beruf</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                                    <input type="text" class="form-control" id="beruf" required placeholder="z.B. Full-Stack-Entwickler">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="skills" class="form-label">Fähigkeiten & Qualifikationen</label>
                                <textarea class="form-control" id="skills" required placeholder="z.B. Node.js, SQLite, Bootstrap, Teamfähig" rows="3"></textarea>
                                <div class="form-text">Kommagetrennte Liste von Vorteilen.</div>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 py-2 shadow-sm">
                                <i class="bi bi-cloud-arrow-up-fill me-2"></i>In Datenbank speichern
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h4 class="text-secondary mb-0">Gespeicherte Lebensläufe</h4>
                    <span class="badge bg-secondary rounded-pill" id="anzahl-badge">0 Einträge</span>
                </div>
                
                <div id="lebenslauf-container">
                    <div class="text-center py-5 text-muted">
                        <div class="spinner-border text-primary mb-2" role="status"></div>
                        <p>Lade Datenbank-Einträge...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. DATEN AUS DER DATENBANK LADEN (GET)
        async function ladeLebenslaeufe() {
            try {
                const antwort = await fetch('/api/lebenslaeufe');
                const daten = await antwort.json();
                
                const container = document.getElementById('lebenslauf-container');
                const badge = document.getElementById('anzahl-badge');
                
                container.innerHTML = ''; 
                badge.innerText = `${daten.length} ${daten.length === 1 ? 'Eintrag' : 'Einträge'}`;

                if(daten.length === 0) {
                    container.innerHTML = `
                        <div class="alert alert-info shadow-sm text-center py-4" role="alert">
                            <i class="bi bi-info-circle fs-3 d-block mb-2"></i>
                            Keine Lebensläufe in der SQLite-Datenbank gefunden. Leg rechts einen an!
                        </div>`;
                    return;
                }

                // Generiere hübsche Bootstrap-Karten für jeden Eintrag
                daten.forEach(profil => {
                    const karte = document.createElement('div');
                    karte.className = 'card shadow-sm border-0 mb-3 border-start border-primary border-4';
                    karte.innerHTML = `
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h5 class="card-title text-dark mb-1">${profil.name}</h5>
                                    <p class="text-muted small mb-3">
                                        <i class="bi bi-briefcase me-1"></i> ${profil.beruf}
                                    </p>
                                </div>
                                <span class="badge bg-light text-dark border">ID: #${profil.id}</span>
                            </div>
                            <div class="bg-light p-2 rounded">
                                <strong class="text-primary small d-block mb-1">Skills:</strong>
                                <span class="text-secondary">${profil.skills}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(karte);
                });
            } catch (fehler) {
                console.error("Fehler beim Laden:", fehler);
                document.getElementById('lebenslauf-container').innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> Fehler beim Verbinden mit dem Node.js Server.
                    </div>`;
            }
        }

        // 2. NEUEN EINTRAG SPEICHERN (POST)
        document.getElementById('lebenslauf-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const neuerLebenslauf = {
                name: document.getElementById('name').value,
                beruf: document.getElementById('beruf').value,
                skills: document.getElementById('skills').value
            };

            try {
                const antwort = await fetch('/api/lebenslaeufe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(neuerLebenslauf)
                });

                if (antwort.ok) {
                    document.getElementById('lebenslauf-form').reset();
                    ladeLebenslaeufe(); // Ansicht sofort aktualisieren
                } else {
                    alert("Server-Fehler beim Speichern.");
                }
            } catch (fehler) {
                console.error("Fehler beim Senden:", fehler);
                alert("Verbindung fehlgeschlagen.");
            }
        });

        // Initiales Laden beim Seitenaufruf
        ladeLebenslaeufe();
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
